spring.application.name=produtos-api
spring.profiles.default=dev

server.port=${PORT:8080}
server.error.include-stacktrace=never

spring.mvc.problemdetails.enabled=true

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html

app.estoque.limite-baixo=5

app.supabase.url=${SUPABASE_URL:https://epzzbcdoukukfvhzonar.supabase.co}
app.supabase.secret-key=${SUPABASE_SECRET_KEY:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://productmoduleinterface*.vercel.app,https://product-module-interface*.vercel.app}
