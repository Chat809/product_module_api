spring.application.name=produtos-api
spring.profiles.default=dev

server.port=${PORT:8080}
server.error.include-stacktrace=never

spring.datasource.url=jdbc:h2:mem:produtosdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html

app.estoque.limite-baixo=5

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://productmoduleinterface*.vercel.app,https://product-module-interface*.vercel.app}
